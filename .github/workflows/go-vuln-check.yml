name: Vulnerabilities
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Trigger every day at 16:00 UTC
    - cron: '0 16 * * *'
    
permissions: 
  contents: read
  security-events: write

jobs:
  Check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Use the patched Go toolchain for standard library vulnerability checks.
          go-version: '1.26.10'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Scan for Vulnerabilities in Code
        id: scan
        run: |
          govulncheck -format=json ./... > "$RUNNER_TEMP/govulncheck.json"
          govulncheck -mode=convert -format=sarif < "$RUNNER_TEMP/govulncheck.json" > "$RUNNER_TEMP/govulncheck.sarif"
      - name: Report vulnerabilities in CI log
        # Text output includes affected/fixed versions and call stacks, and fails on vulnerabilities.
        run: |
          govulncheck -mode=convert -format=text -show=verbose,traces < "$RUNNER_TEMP/govulncheck.json"
          # Preserve strict mode for findings without reachable call stacks too.
          if ! jq -e -s 'all(.[]; .finding == null)' "$RUNNER_TEMP/govulncheck.json" > /dev/null; then
            echo "::error::govulncheck found vulnerabilities in dependencies. See the report above."
            exit 1
          fi
      - name: Upload vulnerability report
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@v4.39.2
        with:
          sarif_file: ${{ runner.temp }}/govulncheck.sarif
