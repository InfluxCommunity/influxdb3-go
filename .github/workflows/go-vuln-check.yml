name: Vulnerabilities
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Trigger every day at 16:00 UTC
    - cron: '0 16 * * *'
    
permissions: 
  security-events: write

jobs:
  Check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for Vulnerabilities in Code
        uses: Templum/govulncheck-action@v1.0.2
        with:
          # Go 1.26.9 includes the standard library security fixes missing from Go 1.25.
          go-version: '1.26.9'
          vulncheck-version: v1.1.4
          package: ./...
          fail-on-vuln: true
